<p style="font-size: smaller">
  Citation:
  {{ page.author }}, ({{ page.year }}), {{ page.title }}.
  {% if page.journal %}
  <i>{{ page.journal }}</i>,
  {% endif %}
  {% if page.volume %}
  {{ page.volume }}:{{ page.pages }}. <br>
  {% endif %}
  {% if page.doi %}
  DOI: <a href="https://doi.org/{{ page.doi }}" target="_blank">{{ page.doi }}</a>
  {% endif %}
</p>
